name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      E2E_ENABLED: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' && vars.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_ANON_KEY != '' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'local-ci-test-key' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run unit and component tests
        run: npm run test:run

      - name: Install Playwright browser
        if: ${{ env.E2E_ENABLED == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        if: ${{ env.E2E_ENABLED == 'true' }}
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Explain why end-to-end tests were skipped
        if: ${{ env.E2E_ENABLED != 'true' }}
        run: echo "E2E tests skipped; configure the Supabase URL, anon key, and E2E test-account credentials to enable them."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.E2E_ENABLED == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
